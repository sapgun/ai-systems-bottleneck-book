name: Normalize PDF for GitHub preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-pdf.yml'
      - 'book/AI_Systems_Bottleneck_KR.pdf'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils

      - name: Normalize PDF for broad renderer compatibility
        run: |
          set -euo pipefail
          SRC="book/AI_Systems_Bottleneck_KR.pdf"
          TMP="book/AI_Systems_Bottleneck_KR.normalized.pdf"

          gs \
            -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.4 \
            -dPDFSETTINGS=/prepress \
            -dNOPAUSE \
            -dQUIET \
            -dBATCH \
            -dDetectDuplicateImages=true \
            -dCompressFonts=true \
            -dPreserveAnnots=true \
            -dPreserveMarkedContent=false \
            -sOutputFile="$TMP" \
            "$SRC"

          pdfinfo "$TMP" | grep -E 'Pages|Encrypted|PDF version|Tagged|File size'
          mv "$TMP" "$SRC"

      - name: Commit normalized PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/AI_Systems_Bottleneck_KR.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Normalize PDF for GitHub preview compatibility"
            git push
          fi
